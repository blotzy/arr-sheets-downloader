[google]
# Authentication: use one of api_key or service_account_file (not both)
api_key = "example"
# service_account_file = "/path/to/service-account.json"
spreadsheet_id = "12345asdfbowijid"
# In this example, "Downloads" is the name of the tab in the sheet that we're monitoring
# A2:A means process everything in the first column, skipping the first row if using that as a header
spreadsheet_range = "Downloads!A2:A"
write_status = true  # set to false to skip writing status/date back to the sheet
# Only relevant if you're using LazyLibrarian
ebooks_range = "Ebooks!A2:A"
audiobooks_range = "Audiobooks!A2:A"

[radarr]
api_key = "example"
url = "http://localhost:1234"
quality_profile = 1
root_folder_path = "/mnt/Media/Movies"
# spreadsheet_id = "separate-movies-sheet-id"  # defaults to [google] spreadsheet_id if omitted
# spreadsheet_range = "Movies!A2:A"            # defaults to [google] spreadsheet_range if omitted

[sonarr]
api_key = "example"
url = "http://localhost:5678"
quality_profile = 1
root_folder_path = "/mnt/Media/TV"
# spreadsheet_id = "separate-tv-sheet-id"      # defaults to [google] spreadsheet_id if omitted
# spreadsheet_range = "TV!A2:A"                # defaults to [google] spreadsheet_range if omitted

[lazylibrarian]
api_key = "example"
url = "http://localhost:5299"
# spreadsheet_id = "separate-sheet-id"  # defaults to [google] spreadsheet_id if omitted
